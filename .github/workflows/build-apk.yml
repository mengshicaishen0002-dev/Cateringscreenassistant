name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v2.8 project
        run: |
          mkdir project
          ZIP_FILE=$(ls -1t CateringScreenAssistant-v2.8.0-project*.zip | head -n 1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run v2.8 regression tests
        working-directory: project
        run: bash ./run-regression-tests.sh

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk \
          CateringScreenAssistant-v2.8.0-Galaxy-A15-Android16.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CateringScreenAssistant-v2.8.0-Galaxy-A15-Android16
          path: CateringScreenAssistant-v2.8.0-Galaxy-A15-Android16.apk
          if-no-files-found: error
