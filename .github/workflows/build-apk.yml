name: Build signed CSA APK v2.10.307 candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-apk.yml
      - CateringScreenAssistant-v2.10.307-Source.zip
permissions:
  contents: read
jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and unpack exact source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check <<'HASH'
          b7d44203dfefc1fa170769f08744635ffdc7273fedcca3da6bf91860794dfa09  CateringScreenAssistant-v2.10.307-Source.zip
          HASH
          unzip -tq CateringScreenAssistant-v2.10.307-Source.zip
          unzip -q CateringScreenAssistant-v2.10.307-Source.zip -d "$RUNNER_TEMP/csa-source"
          project="$RUNNER_TEMP/csa-source/CateringScreenAssistant-v2.10.307"
          grep -Fq 'versionCode 333' "$project/app/build.gradle"
          grep -Fq 'versionName "2.10.307"' "$project/app/build.gradle"
          echo "CSA_PROJECT_DIR=$project" >> "$GITHUB_ENV"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Restore existing upgrade signing key
        shell: bash
        env:
          CSA_KEYSTORE_BASE64: ${{ secrets.CSA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CSA_KEYSTORE_BASE64"
          printf '%s' "$CSA_KEYSTORE_BASE64" | base64 --decode > "$CSA_PROJECT_DIR/csa-upgrade.keystore"
          chmod 600 "$CSA_PROJECT_DIR/csa-upgrade.keystore"
      - name: Run regression suite
        shell: bash
        run: bash "$CSA_PROJECT_DIR/run-regression-tests.sh"
      - name: Build signed release
        shell: bash
        run: gradle --no-daemon --stacktrace --project-dir "$CSA_PROJECT_DIR" :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CateringScreenAssistant-v2.10.307-Signed-APK
          path: ${{ env.CSA_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
