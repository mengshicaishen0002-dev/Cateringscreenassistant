name: Build signed CSA APK v2.10.302 (Google Drive)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-apk.yml
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Paste the public Google Drive share URL of v2.10.302 source ZIP'
        required: true
        type: string
        default: 'https://drive.google.com/file/d/1CLl4QiicR34JOzvNIi1M98p3ca1QMziY/view?usp=drivesdk'

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download v2.10.302 source from Google Drive
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url || 'https://drive.google.com/file/d/1CLl4QiicR34JOzvNIi1M98p3ca1QMziY/view?usp=drivesdk' }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/CateringScreenAssistant-v2.10.302-Source.zip"
          
          # Fail rather than silently building another version.
          file_id="$(python3 - "$SOURCE_URL" <<'PY_DRIVE_ID'
          import re,sys
          url=sys.argv[1]
          m=re.search(r'/file/d/([^/?&#]+)',url) or re.search(r'[?&]id=([^&#]+)',url)
          if not m:
              raise SystemExit('ERROR: input source_url must be a Google Drive file share link')
          print(m.group(1))
          PY_DRIVE_ID
          )"
          direct_url="https://drive.google.com/uc?export=download&id=$file_id"

          # Small public Drive files usually download directly. If Google
          # returns an HTML confirmation page, use gdown as a fallback.
          if ! curl --fail --location --silent --show-error --retry 3 \
              --connect-timeout 25 --max-time 180 \
              "$direct_url" --output "$archive" \
              || ! unzip -tq "$archive" >/dev/null 2>&1; then
            echo 'Trying Google Drive downloader fallback...'
            rm -f "$archive"
            python3 -m venv "$RUNNER_TEMP/csa-gdown-venv"
            "$RUNNER_TEMP/csa-gdown-venv/bin/pip" install \
              --disable-pip-version-check --quiet gdown
            "$RUNNER_TEMP/csa-gdown-venv/bin/gdown" \
              --fuzzy "$SOURCE_URL" --output "$archive"
          fi

          # Verify the exact v2.10.302 source ZIP; block older or mismatched uploads.
          printf '%s  %s\n' \
            '37fd82fd2a0db3df3413ab3ca1a7fc6af689a212721f14920e4c05dd6760e2f0' \
            "$archive" | sha256sum --check || {
              echo 'ERROR: Downloaded ZIP is not the v2.10.302 package. Check the Drive link; this is NOT an APK parse failure.' >&2
              exit 1
            }
          unzip -tq "$archive"
          echo "Verified ZIP SHA256: $(sha256sum "$archive" | cut -d' ' -f1)"
          mkdir -p "$RUNNER_TEMP/csa-source"
          unzip -q "$archive" -d "$RUNNER_TEMP/csa-source"
          project="$RUNNER_TEMP/csa-source/CateringScreenAssistant-v2.10.302"
          test -f "$project/app/build.gradle"
          test -f "$project/settings.gradle"
          test -f "$project/run-regression-tests.sh"
          grep -Fq 'versionCode 328' "$project/app/build.gradle"
          grep -Fq 'versionName "2.10.302"' "$project/app/build.gradle"
          echo "CSA_PROJECT_DIR=$project" >> "$GITHUB_ENV"
          echo 'Verified v2.10.302 source ZIP and project layout.'
          if grep -Fq 'if(indexed==null && !service.liveOfferSignal(' \
              "$project/app/src/main/java/com/local/cateringscreenassistant/OcrMonitorService.java"; then
            echo 'Old Java scope error is still present; refusing to compile' >&2
            exit 1
          fi

      # GitHub-hosted ubuntu-24.04 already ships Android SDK 35 and
      # Build Tools 35.0.0. Avoid re-installing command-line tools.
      - name: Verify preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -f "$sdk/platforms/android-35/android.jar" ]; then
            echo "Missing Android SDK 35 at $sdk" >&2
            exit 1
          fi
          if [ ! -x "$sdk/build-tools/35.0.0/aapt2" ]; then
            echo "Missing Android Build Tools 35.0.0 at $sdk" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo 'Using preinstalled Android SDK 35 / Build Tools 35.0.0.'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore APK upgrade-signing key
        shell: bash
        env:
          CSA_KEYSTORE_BASE64: ${{ secrets.CSA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$CSA_KEYSTORE_BASE64" ]; then
            echo 'Missing GitHub Actions secret: CSA_KEYSTORE_BASE64' >&2
            exit 1
          fi
          printf '%s' "$CSA_KEYSTORE_BASE64" | base64 --decode \
            > "$CSA_PROJECT_DIR/csa-upgrade.keystore"
          chmod 600 "$CSA_PROJECT_DIR/csa-upgrade.keystore"
          keytool -list -keystore "$CSA_PROJECT_DIR/csa-upgrade.keystore" \
            -storepass 'csa-update-2026' -alias csa >/dev/null

      - name: Run v2.10.302 regression tests
        shell: bash
        run: bash "$CSA_PROJECT_DIR/run-regression-tests.sh"

      - name: Compile signed release APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace --project-dir "$CSA_PROJECT_DIR" \
            :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CateringScreenAssistant-v2.10.302-Signed-APK
          path: ${{ env.CSA_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
