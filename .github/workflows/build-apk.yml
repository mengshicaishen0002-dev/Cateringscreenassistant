name: Build signed CSA APK v2.10.305 (verified source)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-apk.yml
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Paste the public Google Drive share URL of v2.10.305 source ZIP'
        required: false
        type: string
        default: 'https://drive.google.com/file/d/1aBapxHzfNpZ38v0EiriGSUgwhHxpwsfA/view?usp=drivesdk'

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download v2.10.305 source from Google Drive
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url || 'https://drive.google.com/file/d/1aBapxHzfNpZ38v0EiriGSUgwhHxpwsfA/view?usp=drivesdk' }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/CateringScreenAssistant-v2.10.305-Source.zip"
          
          # Fail rather than silently building another version.
          file_id="$(python3 - "$SOURCE_URL" <<'PY_DRIVE_ID'
          import re,sys
          url=sys.argv[1]
          m=re.search(r'/file/d/([^/?&#]+)',url) or re.search(r'[?&]id=([^&#]+)',url)
          if not m:
              raise SystemExit('ERROR: input source_url must be a Google Drive file share link')
          print(m.group(1))
          PY_DRIVE_ID
          )"
          direct_url="https://drive.google.com/uc?export=download&id=$file_id"

          # Validate exact contents even if the archive was re-compressed.
          verifier="$RUNNER_TEMP/verify-v305.py"
          cat > "$verifier" <<'PY_VERIFY'
          import hashlib, json, pathlib, stat, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          expected_zip = 'ee7bdf8249bdcc7ca673ac2244c1c809ebb72dd36cf6ce670b1d07a13f3f1739'
          expected_content = 'e6ecfc601824751b631c4912968d6efe4059edac2113dbe4eb412c6d6f127f19'
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          print('Expected archive SHA256:', expected_zip)
          print('Actual archive SHA256:  ', actual)
          print('Downloaded bytes:', archive.stat().st_size)
          try:
              with zipfile.ZipFile(archive) as z:
                  items = z.infolist()
                  if len(items) > 500 or sum(i.file_size for i in items) > 10_000_000:
                      raise ValueError('Unexpected ZIP size or entry count')
                  names = set()
                  manifest = []
                  for i in items:
                      p = pathlib.PurePosixPath(i.filename)
                      if p.is_absolute() or '..' in p.parts or '\\' in i.filename or i.filename in names or stat.S_ISLNK(i.external_attr >> 16):
                          raise ValueError('Unsafe or duplicate ZIP entry')
                      names.add(i.filename)
                      if not i.is_dir():
                          manifest.append((i.filename, hashlib.sha256(z.read(i)).hexdigest()))
                  digest = hashlib.sha256(json.dumps(sorted(manifest), ensure_ascii=True, separators=(',', ':')).encode()).hexdigest()
                  print('Source file count:', len(manifest))
                  print('Expected source content SHA256:', expected_content)
                  print('Actual source content SHA256:  ', digest)
                  if digest != expected_content:
                      raise ValueError('Source files or project paths differ from verified v2.10.305')
                  print('PASS: exact original ZIP' if actual == expected_zip else 'PASS: repacked ZIP with identical file paths and contents')
          except (OSError, ValueError, zipfile.BadZipFile, RuntimeError) as e:
              print('ERROR:', e, file=sys.stderr)
              sys.exit(1)
          PY_VERIFY
          if ! curl --fail --location --silent --show-error --retry 3 \
              --connect-timeout 25 --max-time 180 \
              "$direct_url" --output "$archive" \
              || ! python3 "$verifier" "$archive"; then
            echo 'Direct download did not match; trying Google Drive downloader fallback...'
            rm -f "$archive"
            python3 -m venv "$RUNNER_TEMP/csa-gdown-venv"
            "$RUNNER_TEMP/csa-gdown-venv/bin/pip" install \
              --disable-pip-version-check --quiet "gdown==6.5.2"
            "$RUNNER_TEMP/csa-gdown-venv/bin/gdown" \
              "$file_id" --output "$archive"
            python3 "$verifier" "$archive" || {
              echo 'ERROR: Drive file does not contain the verified v2.10.305 source. Upload the original ZIP without extracting it.' >&2
              exit 1
            }
          fi
          unzip -tq "$archive"
          mkdir -p "$RUNNER_TEMP/csa-source"
          unzip -q "$archive" -d "$RUNNER_TEMP/csa-source"
          project="$RUNNER_TEMP/csa-source/CateringScreenAssistant-v2.10.305"
          test -f "$project/app/build.gradle"
          test -f "$project/settings.gradle"
          test -f "$project/run-regression-tests.sh"
          grep -Fq 'versionCode 331' "$project/app/build.gradle"
          grep -Fq 'versionName "2.10.305"' "$project/app/build.gradle"
          echo "CSA_PROJECT_DIR=$project" >> "$GITHUB_ENV"
          echo 'Verified v2.10.305 source ZIP and project layout.'
          if grep -Fq 'if(indexed==null && !service.liveOfferSignal(' \
              "$project/app/src/main/java/com/local/cateringscreenassistant/OcrMonitorService.java"; then
            echo 'Old Java scope error is still present; refusing to compile' >&2
            exit 1
          fi

      # GitHub-hosted ubuntu-24.04 already ships Android SDK 35 and
      # Build Tools 35.0.0. Avoid re-installing command-line tools.
      - name: Verify preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -f "$sdk/platforms/android-35/android.jar" ]; then
            echo "Missing Android SDK 35 at $sdk" >&2
            exit 1
          fi
          if [ ! -x "$sdk/build-tools/35.0.0/aapt2" ]; then
            echo "Missing Android Build Tools 35.0.0 at $sdk" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo 'Using preinstalled Android SDK 35 / Build Tools 35.0.0.'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore APK upgrade-signing key
        shell: bash
        env:
          CSA_KEYSTORE_BASE64: ${{ secrets.CSA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$CSA_KEYSTORE_BASE64" ]; then
            echo 'Missing GitHub Actions secret: CSA_KEYSTORE_BASE64' >&2
            exit 1
          fi
          printf '%s' "$CSA_KEYSTORE_BASE64" | base64 --decode \
            > "$CSA_PROJECT_DIR/csa-upgrade.keystore"
          chmod 600 "$CSA_PROJECT_DIR/csa-upgrade.keystore"
          keytool -list -keystore "$CSA_PROJECT_DIR/csa-upgrade.keystore" \
            -storepass 'csa-update-2026' -alias csa >/dev/null

      - name: Run v2.10.305 regression tests
        shell: bash
        run: bash "$CSA_PROJECT_DIR/run-regression-tests.sh"

      - name: Compile signed release APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace --project-dir "$CSA_PROJECT_DIR" \
            :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CateringScreenAssistant-v2.10.305-Signed-APK
          path: ${{ env.CSA_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
